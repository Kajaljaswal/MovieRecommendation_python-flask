<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Recommender</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container my-5">
        <div class="text-center">
            <h1>Movie Recommender System</h1>
        </div>

        <!-- Movie Selection Form -->
        <form method="POST">
            <div class="mb-3">
                <label for="movieSelect" class="form-label">Select a Movie</label>
                <select name="movie" id="movieSelect" class="form-select">
                    {% for movie in movie_list %}
                        <option value="{{ movie }}">{{ movie }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="text-center">
                <button type="submit" class="btn btn-primary">Show Recommendations</button>
            </div>
        </form>

        <!-- Recommended Movies Section (only show if recommendations are available) -->
        {% if data %}
        <div class="mt-5">
            <h2>Recommended Movies</h2>
            <div class="row">
                {% for name, poster in data %}
                    <div class="col-md-3 mb-4">
                        <div class="card">
                            <img src="{{ poster }}" alt="{{ name }}" class="card-img-top" style="height: 300px; object-fit: cover;">
                            <div class="card-body">
                                <h5 class="card-title">{{ name }}</h5>
                            </div>
                        </div>
                    </div>
                {% endfor %}
            </div>
        </div>
        {% endif %}
    </div>

    <!-- Bootstrap JS and dependencies -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.min.js"></script>
</body>
</html>
